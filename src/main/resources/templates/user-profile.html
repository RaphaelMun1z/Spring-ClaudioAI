<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil do Usuário</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg:        #0f0f0f;
            --surface:   #1a1a1a;
            --border:    rgba(255, 255, 255, 0.08);
            --accent:    #4285f4;
            --accent-soft: rgba(66, 133, 244, 0.12);
            --text-primary:   #f0f0f0;
            --text-secondary: #888;
            --radius:    20px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;

            /* subtle grid texture */
            background-image:
                    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* ── Card ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.5rem 2rem 2rem;
            width: 100%;
            max-width: 360px;
            text-align: center;
            position: relative;
            overflow: hidden;

            animation: rise .5s cubic-bezier(.22,1,.36,1) both;
        }

        /* glow blob behind the avatar */
        .card::before {
            content: '';
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(66,133,244,.18) 0%, transparent 70%);
            pointer-events: none;
        }

        /* ── Google badge ── */
        .google-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-soft);
            border: 1px solid rgba(66,133,244,.25);
            border-radius: 100px;
            padding: 4px 12px 4px 8px;
            font-size: 11px;
            font-weight: 500;
            color: #7faff7;
            letter-spacing: .4px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .google-badge svg { flex-shrink: 0; }

        /* ── Avatar ── */
        .avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 1.25rem;
        }

        .avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
            display: block;
        }

        /* fallback initials avatar (shown when no photo) */
        .avatar-fallback {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: var(--accent-soft);
            border: 2px solid rgba(66,133,244,.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Serif Display', serif;
            font-size: 32px;
            color: #7faff7;
        }

        /* online dot */
        .avatar-wrapper::after {
            content: '';
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 14px;
            height: 14px;
            background: #34a853;
            border-radius: 50%;
            border: 2px solid var(--surface);
        }

        /* ── User info ── */
        .user-name {
            font-family: 'DM Serif Display', serif;
            font-size: 1.5rem;
            color: var(--text-primary);
            letter-spacing: -.3px;
            margin-bottom: .35rem;
        }

        .user-email {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: .2px;
            margin-bottom: 1.75rem;
        }

        /* ── Divider ── */
        .divider {
            height: 1px;
            background: var(--border);
            margin: 0 -2rem 1.75rem;
        }

        /* ── Action button ── */
        .btn-logout {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background .15s, border-color .15s, color .15s;
            text-decoration: none;
        }

        .btn-logout:hover {
            background: rgba(255,255,255,.05);
            border-color: rgba(255,255,255,.15);
            color: var(--text-primary);
        }

        .btn-logout:active {
            background: rgba(255,255,255,.08);
            transform: scale(.98);
        }

        /* ── Animation ── */
        @keyframes rise {
            from { opacity: 0; transform: translateY(24px) scale(.97); }
            to   { opacity: 1; transform: translateY(0)   scale(1);    }
        }
    </style>
</head>
<body>

<article class="card" aria-label="Perfil do usuário">

    <!-- Google badge -->
    <div class="google-badge">
        <!-- Google "G" icon -->
        <svg width="14" height="14" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
            <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
            <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Conectado via Google
    </div>

    <!-- Avatar -->
    <div class="avatar-wrapper">
        <!--
          Se o atributo "photo" existir e não estiver vazio, exibe a foto.
          Caso contrário, exibe as iniciais do nome.
        -->
        <img
                th:if="${photo != null and !#strings.isEmpty(photo)}"
                th:src="${photo}"
                th:alt="${name}"
                class="avatar"
                referrerpolicy="no-referrer"
        />
        <div
                th:unless="${photo != null and !#strings.isEmpty(photo)}"
                class="avatar-fallback"
                th:text="${name != null and #strings.length(name) > 0 ? #strings.substring(name, 0, 1).toUpperCase() : '?'}"
        ></div>
    </div>

    <!-- Nome -->
    <h1 class="user-name" th:text="${name}">Nome do Usuário</h1>

    <!-- E-mail -->
    <p class="user-email" th:text="${email}">email@exemplo.com</p>

    <div class="divider" role="separator"></div>

    <!-- Logout -->
    <a href="/logout" class="btn-logout">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Sair da conta
    </a>

</article>

</body>
</html>
