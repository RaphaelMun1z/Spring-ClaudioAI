<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ClaudioAI — Entrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Lora:ital,wght@0,400;1,400&display=swap"
          rel="stylesheet"/>
    <style>
        :root {
            --bg: #1a1a19;
            --surface: #262624;
            --surface-2: #2e2e2c;
            --border: rgba(255, 255, 255, 0.06);
            --border-2: rgba(255, 255, 255, 0.10);
            --text-1: #ececea;
            --text-2: #9b9b97;
            --text-3: #5a5a56;
            --accent: #cc785c;
            --accent-soft: rgba(204, 120, 92, 0.12);
            --radius-md: 12px;
            --radius-lg: 18px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Sora', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-1);
            -webkit-font-smoothing: antialiased;
            background-image: linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
            background-size: 48px 48px;
        }

        /* Logo */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 2.5rem;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon svg {
            width: 20px;
            height: 20px;
        }

        .logo-name {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -.3px;
        }

        /* Card */
        .card {
            background: var(--surface);
            border: 1px solid var(--border-2);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .card-title {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--text-1);
            margin-bottom: .5rem;
        }

        .card-sub {
            font-size: 13px;
            font-weight: 300;
            color: var(--text-2);
            margin-bottom: 2rem;
        }

        /* Google button */
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 44px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-2);
            background: var(--surface-2);
            color: var(--text-1);
            font-family: 'Sora', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: background .15s, border-color .15s;
        }

        .btn-google:hover {
            background: #353533;
            border-color: rgba(255, 255, 255, .18);
        }

        .btn-google:active {
            transform: scale(.98);
        }

        .footer-note {
            margin-top: 1.5rem;
            font-size: 11px;
            font-weight: 300;
            color: var(--text-3);
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="logo">
    <div class="logo-icon">
        <svg viewBox="0 0 20 20" fill="none">
            <path d="M14 6.5C12.9 5.56 11.52 5 10 5C6.69 5 4 7.69 4 11s2.69 6 6 6c1.52 0 2.9-.56 3.95-1.48"
                  stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </div>
    <span class="logo-name">ClaudioAI</span>
</div>

<div class="card">
    <h1 class="card-title">Bem-vindo</h1>
    <p class="card-sub">Entre com sua conta Google para continuar</p>

    <a href="/oauth2/authorization/google" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"
                  fill="#4285F4"/>
            <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"
                  fill="#34A853"/>
            <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"
                  fill="#FBBC05"/>
            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"
                  fill="#EA4335"/>
        </svg>
        Entrar com Google
    </a>

    <p class="footer-note">
        Ao continuar, você concorda com os<br/>termos de uso do ClaudioAI.
    </p>
</div>

</body>
</html>
