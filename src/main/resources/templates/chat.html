<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout(~{::title}, ~{::styles}, ~{::content}, ~{::scripts})}">
<head>
    <title>ClaudioAI</title>

    <th:block th:fragment="styles">
        <style>
            /* ── Chat page styles ── */
            .chat-area {
                flex: 1;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                position: relative;
            }

            /* ── Empty / welcome state ── */
            .welcome {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 2rem;
                gap: 0;
            }

            .welcome-logo {
                width: 52px;
                height: 52px;
                background: var(--accent);
                border-radius: 14px;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 1.5rem;
            }

            .welcome-logo svg {
                width: 28px;
                height: 28px;
            }

            .welcome-title {
                font-family: var(--font-serif);
                font-size: 2rem;
                font-weight: 400;
                font-style: italic;
                color: var(--text-1);
                letter-spacing: -.5px;
                margin-bottom: .5rem;
                text-align: center;
            }

            .welcome-sub {
                font-size: 13px;
                font-weight: 300;
                color: var(--text-2);
                margin-bottom: 2.5rem;
                text-align: center;
            }

            /* suggestion chips */
            .chips {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                max-width: 520px;
                width: 100%;
                margin-bottom: 2.5rem;
            }

            .chip {
                background: var(--surface);
                border: 1px solid var(--border-2);
                border-radius: var(--radius-md);
                padding: 12px 14px;
                cursor: pointer;
                transition: background .14s, border-color .14s;
                text-align: left;
            }

            .chip:hover {
                background: var(--surface-2);
                border-color: var(--border-3);
            }

            .chip-label {
                font-size: 12px;
                font-weight: 500;
                color: var(--text-1);
                margin-bottom: 2px;
            }

            .chip-sub {
                font-size: 11px;
                font-weight: 300;
                color: var(--text-3);
            }

            /* ── Input bar ── */
            .input-bar-wrap {
                padding: 0 1.5rem 1.5rem;
                max-width: 720px;
                width: 100%;
                margin: 0 auto;
            }

            .input-bar {
                display: flex;
                align-items: flex-end;
                gap: 0;
                background: var(--surface);
                border: 1px solid var(--border-3);
                border-radius: var(--radius-lg);
                padding: 10px 10px 10px 16px;
                transition: border-color .15s, box-shadow .15s;
            }

            .input-bar:focus-within {
                border-color: rgba(204, 120, 92, .4);
                box-shadow: 0 0 0 3px rgba(204, 120, 92, .08);
            }

            .input-textarea {
                flex: 1;
                background: transparent;
                border: none;
                outline: none;
                font-family: var(--font-ui);
                font-size: 14px;
                font-weight: 300;
                color: var(--text-1);
                resize: none;
                min-height: 24px;
                max-height: 200px;
                line-height: 1.55;
                padding: 2px 0;
            }

            .input-textarea::placeholder {
                color: var(--text-3);
            }

            .input-actions {
                display: flex;
                align-items: flex-end;
                gap: 4px;
                flex-shrink: 0;
                padding-left: 8px;
            }

            .input-btn {
                width: 34px;
                height: 34px;
                border-radius: 9px;
                border: none;
                background: transparent;
                color: var(--text-3);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: background .13s, color .13s;
                flex-shrink: 0;
            }

            .input-btn:hover {
                background: var(--surface-2);
                color: var(--text-2);
            }

            .input-btn.primary {
                background: var(--accent);
                color: #fff;
            }

            .input-btn.primary:hover {
                background: var(--accent-2);
            }

            .input-btn.primary:disabled {
                background: var(--surface-3);
                color: var(--text-3);
                cursor: not-allowed;
            }

            .input-hint {
                text-align: center;
                font-size: 10.5px;
                color: var(--text-3);
                margin-top: 10px;
                font-weight: 300;
            }

            /* ── Messages (hidden in welcome state, shown when chat starts) ── */
            .messages {
                flex: 1;
                overflow-y: auto;
                padding: 2rem 0 1rem;
                display: flex;
                flex-direction: column;
                gap: 2rem;
                max-width: 720px;
                width: 100%;
                margin: 0 auto;
            }

            .msg {
                display: flex;
                gap: 12px;
                padding: 0 1.5rem;
            }

            .msg.user {
                flex-direction: row-reverse;
            }

            .msg-bubble {
                max-width: 78%;
                padding: 11px 15px;
                border-radius: 14px;
                font-size: 13.5px;
                font-weight: 300;
                line-height: 1.65;
            }

            .msg.user .msg-bubble {
                background: var(--surface-3);
                color: var(--text-1);
                border-bottom-right-radius: 4px;
            }

            .msg.ai .msg-bubble {
                background: transparent;
                color: var(--text-1);
                padding-left: 0;
            }

            .msg-avatar {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                flex-shrink: 0;
                margin-top: 2px;
            }

            .msg-avatar-ai {
                width: 28px;
                height: 28px;
                border-radius: 8px;
                background: var(--accent);
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                margin-top: 2px;
            }
        </style>
    </th:block>
</head>

<body>
<th:block th:fragment="content">
    <div class="chat-area">

        <!-- Welcome / empty state -->
        <div class="welcome" id="welcomeState">
            <div class="welcome-logo">
                <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14 6.5C12.9 5.56 11.52 5 10 5C6.69 5 4 7.69 4 11s2.69 6 6 6c1.52 0 2.9-.56 3.95-1.48"
                          stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <h1 class="welcome-title"
                th:with="firstName=${name != null ? #strings.arraySplit(name, ' ')[0] : 'usuário'}"
                th:text="'Olá, ' + ${firstName} + '.'">
                Olá, Usuário.
            </h1>
            <p class="welcome-sub">Como posso ajudar você hoje?</p>

            <div class="chips">
                <div class="chip">
                    <div class="chip-label">Escrever código</div>
                    <div class="chip-sub">Spring Boot, Java, SQL…</div>
                </div>
                <div class="chip">
                    <div class="chip-label">Explicar conceito</div>
                    <div class="chip-sub">OAuth2, JWT, REST…</div>
                </div>
                <div class="chip">
                    <div class="chip-label">Revisar texto</div>
                    <div class="chip-sub">E-mails, docs, relatórios…</div>
                </div>
                <div class="chip">
                    <div class="chip-label">Brainstorm</div>
                    <div class="chip-sub">Ideias para projetos…</div>
                </div>
            </div>
        </div>

        <!-- Input bar -->
        <div class="input-bar-wrap">
            <div class="input-bar">
          <textarea
                  class="input-textarea"
                  id="msgInput"
                  placeholder="Pergunte qualquer coisa…"
                  rows="1"
          ></textarea>
                <div class="input-actions">
                    <!-- attach -->
                    <button class="input-btn" title="Anexar arquivo">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                        </svg>
                    </button>
                    <!-- send -->
                    <button class="input-btn primary" id="sendBtn" title="Enviar" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 19V5M5 12l7-7 7 7"/>
                        </svg>
                    </button>
                </div>
            </div>
            <p class="input-hint">ClaudioAI pode cometer erros. Verifique informações importantes.</p>
        </div>

    </div>
</th:block>

<th:block th:fragment="scripts">
    <script>
        const textarea = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');

        textarea.addEventListener('input', () => {
            // auto-grow
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
            // toggle send button
            sendBtn.disabled = textarea.value.trim() === '';
        });

        textarea.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) sendBtn.click();
            }
        });
    </script>
</th:block>
</body>
</html>
